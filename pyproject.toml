[project]
name = "wde-automacao"
version = "0.1.0"
description = "E2E test suite (Playwright + pytest-bdd) for the WDE Shop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.17.0",
    "pytest>=9.1.1",
    "pytest-bdd>=8.1.0",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.8.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["steps"]
bdd_features_base_dir = "features"
addopts = "--tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure --html=playwright-report/report.html --self-contained-html --dist=loadgroup -m \"not visual\""
xfail_strict = true
markers = [
    "auth: authentication/authorization scenarios",
    "login-admin: admin login scenarios",
    "happy-path: happy path",
    "negative-case: negative case (variant 1, used in login.feature)",
    "negative-path: negative case (variant 2, used in manage_product.feature)",
    "crud: CRUD operations",
    "product: product-related scenarios",
    "order: order-related scenarios",
    "validation: form validation scenarios",
    "security: advanced security scenarios (hardening.feature)",
    "injection: injection attempt scenarios (NoSQL, etc.)",
    "headers: HTTP security header scenarios",
    "csrf: CSRF protection scenarios",
    "session: cookie/session scenarios",
    "error-handling: error handling scenarios",
    "visual: visual regression scenarios (screenshot vs. baseline)",
    "localization: language selector / i18n scenarios",
    "catalog: product catalog filter/sort/search scenarios",
]
playwright_visual_snapshots_path = "__snapshots__"

[dependency-groups]
dev = [
    "pytest-playwright-visual-snapshot>=0.5.1",
]
